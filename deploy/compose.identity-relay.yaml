name: codestra-provisioning-identity-relay

services:
  identity-relay:
    image: ${RELAY_IMAGE:?immutable relay image digest is required}
    container_name: codestra-provisioning-jwks-relay
    entrypoint: ["python", "-c"]
    command:
      - |
        import os,socket,socketserver,threading
        upstream=(os.environ["IDENTITY_UPSTREAM_IP"],443)
        def pump(a,b):
            try:
                while data:=a.recv(65536): b.sendall(data)
            except OSError: pass
            finally:
                try: b.shutdown(socket.SHUT_WR)
                except OSError: pass
        class Handler(socketserver.BaseRequestHandler):
            def handle(self):
                peer=socket.create_connection(upstream,5)
                thread=threading.Thread(target=pump,args=(self.request,peer),daemon=True)
                thread.start(); pump(peer,self.request); thread.join()
        class Server(socketserver.ThreadingTCPServer):
            allow_reuse_address=True
            daemon_threads=True
        Server(("0.0.0.0",443),Handler).serve_forever()
    environment:
      IDENTITY_UPSTREAM_IP: ${IDENTITY_UPSTREAM_IP:?approved canonical identity ingress IP required}
    restart: unless-stopped
    networks:
      identity:
        aliases: [auth.codestra.co]
      egress: {}
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    labels:
      org.opencontainers.image.source: https://github.com/appolon1908-hue/codestra-provisioning-service
      codestra.service: provisioning-identity-relay

networks:
  identity:
    external: true
    name: codestra-identity_identity_service
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 10.254.44.0/28
