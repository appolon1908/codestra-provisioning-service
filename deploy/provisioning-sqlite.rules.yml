groups:
  - name: provisioning-sqlite
    rules:
      - alert: ProvisioningSQLiteUnavailable
        expr: codestra_provisioning_sqlite_available != 1
        for: 2m
        labels: {severity: critical, service: provisioning}
        annotations: {summary: "Provisioning SQLite is unavailable or not writable"}
      - alert: ProvisioningSQLiteWriteFailure
        expr: increase(codestra_provisioning_sqlite_write_errors_total[5m]) > 0
        labels: {severity: critical, service: provisioning}
        annotations: {summary: "Provisioning SQLite writes are failing"}
      - alert: ProvisioningSQLiteLockErrors
        expr: increase(codestra_provisioning_sqlite_lock_errors_total[5m]) > 0
        labels: {severity: warning, service: provisioning}
        annotations: {summary: "Provisioning SQLite lock errors detected"}
      - alert: ProvisioningBackupStale
        expr: time() - codestra_provisioning_sqlite_backup_timestamp_seconds > 86400
        for: 15m
        labels: {severity: critical, service: provisioning}
        annotations: {summary: "Provisioning SQLite backup is older than 24 hours"}
      - alert: ProvisioningBackupFailed
        expr: increase(codestra_provisioning_sqlite_backup_failures_total[1h]) > 0
        labels: {severity: critical, service: provisioning}
        annotations: {summary: "Provisioning SQLite backup failed"}
      - alert: ProvisioningRestoreRehearsalOverdue
        expr: time() - codestra_provisioning_sqlite_restore_rehearsal_timestamp_seconds > 2592000
        for: 1h
        labels: {severity: warning, service: provisioning}
        annotations: {summary: "Provisioning SQLite restore rehearsal is overdue"}
      - alert: ProvisioningDatabaseGrowth
        expr: predict_linear(codestra_provisioning_sqlite_size_bytes[6h], 86400) > 2 * codestra_provisioning_sqlite_size_bytes
        for: 30m
        labels: {severity: warning, service: provisioning}
        annotations: {summary: "Provisioning SQLite growth is anomalous"}
