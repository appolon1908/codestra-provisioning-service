name: Provisioning source validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Existing immutable sha256 digest to sign and verify
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check app tests scripts
      - run: python -m compileall -q app tests scripts
      - run: pytest -q
      - name: Validate production Compose runtime mounts
        run: |
          docker compose -f deploy/compose.production.yaml config --format json |
            python -c 'import json,sys; c=json.load(sys.stdin); assert c["services"]["provisioning-service"]["tmpfs"] == ["/tmp:size=16m,mode=1777"]'
      - name: Validate backup directory ownership contract
        run: >-
          grep -Fxq 'ExecStartPre=/usr/bin/install -d -m 0700 -o 10001 -g 10001 /var/backups/codestra/provisioning'
          deploy/systemd/codestra-provisioning-sqlite-backup.service
      - run: pip-audit --requirement requirements.txt
      - name: Reject whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
        if: github.event_name == 'pull_request'
      - name: Build immutable candidate
        run: |
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg VERSION="$GITHUB_SHA" \
            -t codestra/provisioning-service:"$GITHUB_SHA" .
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: codestra/provisioning-service:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: provisioning-production-release
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
      - run: echo "Immutable image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign exact immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

  verify-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Verify signature identity, issuer, digest, and Rekor inclusion
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - uses: docker/setup-buildx-action@v3
      - name: Verify SBOM and provenance attestations exist
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" \
            --format '{{ json .SBOM }}' | grep -q 'spdxVersion'
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" \
            --format '{{ json .Provenance }}' | grep -q 'buildType'

  sign-existing-release:
    if: github.event_name == 'workflow_dispatch' && inputs.image_digest != ''
    runs-on: ubuntu-latest
    environment: provisioning-production-release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Validate immutable digest input
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Authenticate to GHCR for signature publication
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign exact existing digest
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Independently verify signature identity and issuer
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
